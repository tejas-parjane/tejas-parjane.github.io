<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var key = 'tejas-theme'
          var saved = localStorage.getItem(key)
          var theme = saved === 'light' || saved === 'dark' ? saved : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>Tejas Parjane — Applied AI Engineer</title>
    <meta
      name="description"
      content="Tejas Parjane builds evaluated AI systems, reliable APIs, and decision workflows for startup teams."
    />
    <meta name="author" content="Tejas Parjane" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18201D" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://tejas-parjane.github.io/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Tejas Parjane — Applied AI Engineer" />
    <meta
      property="og:description"
      content="Evaluated AI systems, reliable APIs, and decision workflows for startup teams."
    />
    <meta property="og:url" content="https://tejas-parjane.github.io/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tejas Parjane — Applied AI Engineer" />
    <meta
      name="twitter:description"
      content="Evaluated AI systems, reliable APIs, and decision workflows for startup teams."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />

</html>
